version: 1
worker_key: databaseforge_worker
worker_kind: governed_local_database_static_worker
state: enabled_policy_bound
enabled: true
environment: elysia_workstation
python_path: null
worker_script: sandbox/databaseforge_worker/worker_cli.py
network_allowed: false
cloud_allowed: false
shell_allowed: false
stdin_allowed: false
arbitrary_sql_allowed: false
arbitrary_arguments_allowed: false
max_concurrent_jobs: 1
limits_policy: config/policies/database_inspection_limits.yaml
posture:
  fixed_operations: [metadata, snapshot_schema]
  snapshot_first: true
  source_mutation: false
  row_preview: false
  extension_install_load: false
  external_access: false
  detailed_output_in_central_trace: false
