version: 1
worker_key: blendforge_worker
worker_kind: future_locked_blender_metadata_preview_worker
state: future_sandbox_required
enabled: false
environment: elysia_blendforge
python_path: null
system_blender_path: /usr/bin/blender
network_allowed: false
home_mount_allowed: false
devices_allowed: false
shell_allowed: false
stdin_allowed: false
gui_allowed: false
script_auto_run_allowed: false
embedded_scripts_allowed: false
arbitrary_addons_allowed: false
linked_library_loading_allowed: false
project_root_write_allowed: false
sandbox_output_only: true
live_route_handoff: false
sandbox_runtime: unavailable_unprivileged_user_namespace
fixed_argv_only: true
exact_approval_required: true
max_concurrent_jobs: 1
limits_policy: config/policies/engineering_preview_limits.yaml
