version: 1
worker_key: binaryforge_worker
worker_kind: governed_local_binary_static_worker
state: enabled_policy_bound
enabled: true
environment: elysia_workstation
python_path: null
worker_script: sandbox/binaryforge_worker/worker_cli.py
network_allowed: false
cloud_allowed: false
shell_allowed: false
stdin_allowed: false
arbitrary_arguments_allowed: false
max_concurrent_jobs: 1
limits_policy: config/policies/binary_inspection_limits.yaml
posture:
  fixed_operations: [inspect]
  static_only: true
  execute: false
  load: false
  import_into_runtime: false
  install: false
  link: false
  mutate: false
  patch: false
  disassemble: false
  detailed_output_in_central_trace: false
