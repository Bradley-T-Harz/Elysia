category_e_guidance:
  ollama_local_provider:
    title: Ollama local model provider
    why: Local conversational and embedding model roles need a compatible loopback provider; Core itself remains usable without it.
    official_source: https://docs.ollama.com/linux
    signup_required: No account is required to install Ollama; an individual gated model publisher may require separate terms or an account.
    data_leaving_local_control: Download requests reveal ordinary network metadata to Ollama or the selected model publisher; runtime prompts remain loopback-local under Elysia policy.
    license_privacy_security: Ollama and every selected model have separate licenses. Elysia does not run a moving curl-to-shell installer or create a system service without a separately reviewed exact lifecycle contract.
    supported_steps:
      - Review the current official Linux installation instructions and license.
      - Install Ollama through the publisher-supported method appropriate to the machine.
      - Start the local service and confirm `ollama --version` succeeds.
      - Return to Elysia Setup; approve each exact model identity, license, size, and source separately.
    doctor_detection: Doctor checks the local `ollama` command, loopback reachability, selected model manifests, and required model identities without sending a prompt.
    retry_repair: Repair or update Ollama through its official lifecycle, restart the loopback service, then rerun Elysia Doctor and the exact model acquisition.
  vscode:
    title: VS Code-family Extension Host
    why: The Developer / Codev profile needs a supported VS Code or VSCodium Extension Host.
    official_source: https://code.visualstudio.com/docs/setup/linux
    signup_required: No account is required for a local editor or local VSIX installation.
    data_leaving_local_control: Download and update checks contact the chosen editor publisher. Codev itself has no independent network, shell, package-install, or Git-push authority.
    license_privacy_security: Microsoft VS Code binaries use Microsoft product terms and privacy disclosures; VSCodium has its own publisher and package channel. Elysia detects either host but does not silently choose a publisher, accept product terms, add a repository, or enable editor telemetry for the user.
    supported_steps:
      - Choose VS Code or VSCodium and review that publisher's license, privacy, and update behavior.
      - Install a supported Linux build using the publisher's documented method.
      - Confirm `code --version` or `codium --version` succeeds.
      - Return to Elysia Setup; Setup will acquire and install the exact first-party Codev v1.0.0 VSIX after approval.
    doctor_detection: Doctor detects `code` or `codium`, checks the supported engine range, and verifies the installed Codev extension identity and Elysia API contract.
    retry_repair: Repair or update the chosen editor through its publisher-supported lifecycle, then rerun the Codev component operation and Doctor.
  pytest:
    title: Contributor Python test runner
    why: This is needed only for source-development regression work, not for an ordinary packaged Developer / Codev installation.
    official_source: https://docs.pytest.org/en/stable/getting-started.html
    signup_required: No account is required.
    data_leaving_local_control: Package acquisition contacts the configured Python package index; test execution remains local unless a test explicitly declares another boundary.
    license_privacy_security: Install only in a contributor-owned isolated development environment using the public developer lock and notices.
    supported_steps: [Follow the repository contributor setup and exact developer lock; do not add pytest to the packaged runtime.]
    doctor_detection: Packaged Doctor does not require pytest; contributor verification checks the declared development environment.
    retry_repair: Recreate the contributor environment from the exact developer lock.
  httpx:
    title: Contributor API test client
    why: This is needed only by source-development tests, not by an ordinary packaged Developer / Codev installation.
    official_source: https://www.python-httpx.org/
    signup_required: No account is required.
    data_leaving_local_control: Package acquisition contacts the configured Python package index; test targets remain those explicitly selected by the contributor.
    license_privacy_security: Install only in a contributor-owned isolated development environment using the public developer lock and notices.
    supported_steps: [Follow the repository contributor setup and exact developer lock; do not add HTTPX to the packaged runtime solely for tests.]
    doctor_detection: Packaged Doctor does not require HTTPX; contributor verification checks the declared development environment.
    retry_repair: Recreate the contributor environment from the exact developer lock.
  nodejs_npm:
    title: Node.js and npm contributor toolchain
    why: Required for rebuilding the Desktop or Codev from source; not required to run the packaged Elysia or install the qualified VSIX.
    official_source: https://nodejs.org/en/download
    signup_required: No account is required.
    data_leaving_local_control: Toolchain/package acquisition contacts the selected Node.js and npm sources; repository contents do not leave local control merely by building.
    license_privacy_security: Use the exact versions declared by repository metadata and lockfiles. Elysia Setup does not silently add a third-party Node repository or execute arbitrary package lifecycle scripts.
    supported_steps: [Follow CONTRIBUTING.md and the repository's declared Node version and lockfile commands in an isolated contributor environment.]
    doctor_detection: Packaged Doctor does not require Node/npm; contributor checks verify the declared source-build toolchain.
    retry_repair: Recreate the contributor environment and reinstall from the lockfile without weakening script policy.
  rust_cargo:
    title: Rust and Cargo contributor toolchain
    why: Required for rebuilding the Tauri desktop from source; not required to run Elysia packages.
    official_source: https://www.rust-lang.org/tools/install
    signup_required: No account is required.
    data_leaving_local_control: Toolchain and crate acquisition contact the selected Rust distribution and registry; application data is not involved.
    license_privacy_security: Use the repository's locked Rust dependencies and source-build instructions; do not place a moving compiler toolchain inside the runtime package.
    supported_steps: [Follow CONTRIBUTING.md and the repository's declared Rust/Cargo build instructions in an isolated contributor environment.]
    doctor_detection: Packaged Doctor does not require Rust/Cargo; contributor checks verify Cargo and the locked source build.
    retry_repair: Repair the contributor toolchain, then rebuild against Cargo.lock and rerun the source qualification checks.

system_only_guidance:
  optional_supported_nvidia_driver:
    category: E
    title: Optional supported NVIDIA driver for CUDA profiles
    why: CUDA acceleration requires a host driver compatible with the qualified PyTorch/CUDA runtime; CPU variants remain fully supported when it is absent.
    official_source: https://documentation.ubuntu.com/server/how-to/graphics/install-nvidia-drivers/
    signup_required: No account is required.
    data_leaving_local_control: Ubuntu package acquisition uses configured operating-system repositories; no Elysia user content is involved.
    license_privacy_security: Kernel/driver installation is host-wide and restart-sensitive, so Elysia does not silently change it. Setup selects CPU unless Doctor proves a supported driver and resource state.
    supported_steps:
      - Use Ubuntu's documented driver selection and installation path for the hardware.
      - Reboot when Ubuntu requires it.
      - Confirm `nvidia-smi` reports the expected device and driver.
      - Rerun Elysia Setup/Doctor; never force the CUDA variant past a failed probe.
    doctor_detection: Doctor checks GPU identity, driver/CUDA compatibility, VRAM, real workload behavior, pressure, OOM recovery, and CPU fallback.
    retry_repair: Return to the CPU profile while repairing the host driver through Ubuntu; rerun Doctor before selecting CUDA again.
