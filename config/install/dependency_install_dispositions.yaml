  B: automatically_acquired_by_setup_after_exact_disclosure_and_approval
  C: installed_by_setup_through_the_operating_system_after_exact_privilege_preview
  D: detected_and_reused_from_an_existing_valid_local_installation
  E: documented_user_action_required_because_automatic_installation_is_not_reasonable_or_legally_appropriate

rules:
