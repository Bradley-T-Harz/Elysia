    reason: No current adapter or doctor contract; do not advertise as functional yet.
  espeak_ng:
    reason: No current Elysia TTS adapter or receipt contract; do not advertise as functional yet.

evaluated_cognition_dependencies:
  psutil:
    classification: optional_source_runtime_telemetry_enhancement
    decision: not_promoted_or_bundled_in_packaged_core
    reason: Linux procfs and stdlib provide bounded CPU/RAM/process fallback truth without a new Core dependency; source environments may use psutil when already present.
  nvidia_management:
    classification: existing_driver_tool_telemetry_path
    decision: use_bounded_nvidia_smi_queries_without_python_binding_promotion
    reason: NVIDIA documents NVML as the authority beneath nvidia-smi; Part 2D needs only bounded content-free snapshots and preserves CPU fallback when the driver tool is absent.
  qdrant_client:
    classification: specialized_neurofabric_server_benchmark_client_only
    decision: not_core_required
    reason: Core uses a standard-library authenticated REST client. qdrant-client remains only in the specialized benchmark environment; the promoted server is an optional local profile.
  qwen3_embedding_0_6b:
    classification: promoted_optional_local_semantic_model
    decision: required_for_semantic_local_profile_not_core
    reason: A 28.14% relative semantic-task MRR gain and acceptable warm CPU/GPU latency earned production use without making the model a Core or cloud dependency.
  zstandard:
    classification: promoted_part2e_core_cold_storage_compression
    decision: required_core_runtime
    reason: Part 2E synthetic 10k/100k/1M qualification showed materially faster packed-store writes and rehydration with equal 1M disk under the production compress-only-when-useful policy; canonical SQLite remains authoritative.
  duckdb:
    classification: existing_optional_workstation_database_adapter
    decision: not_memory_authority
    reason: DatabaseForge may inspect selected DuckDB files under its existing contract; DuckDB is not cognition or canonical Memory.
  torch:
    classification: promoted_optional_isolated_neurofabric_runtime
    decision: exact_cpu_and_cuda_variants_profile_gated_not_core
    reason: Part 2D proved official PyTorch CPU and CUDA 13.0 builds in the isolated Neurofabric environment; deterministic governance and canonical Memory remain outside Torch.
  ncps:
    classification: installed_neurofabric_reference_dependency
    decision: preserved_not_promoted_as_cognition_authority
    reason: NCPS 1.0.1 remains reproducible in both Neurofabric profiles, while Elysia-specific controller promotion lacks representative labels, calibration, and rollback evidence.
