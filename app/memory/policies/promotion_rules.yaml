    to_class: conversation
    allowed: true
    review_required: false
    minimum_confidence: 0.40
    minimum_repetition_count: 2
    required_source_kinds:
      - user_message
      - manual_entry
      - project_update
      - assistant_inference
    autonomous_allowed: true
    provisional_first: false
    reason_required: true

