version: "1.0"

notes: |
  Default constitutional posture for each memory class.
  This file defines class temperament and baseline permissions.
  Cross-cutting privacy, retention, mutation-verb, and promotion law belong in the other policy files.

classes:
  working:
    default_sensitivity: internal
    default_mutability: live_editable
    default_status: active
    allowed_mutations:
      - create
      - revise
      - append_note
      - supersede
      - archive
      - restore
      - pin
      - unpin
      - reclassify
      - change_sensitivity
      - change_mutability
      - promote
      - demote
      - merge
      - forget_request
      - block
      - unblock
    blocked_mutations: []
    review_required_mutations:
      - change_sensitivity
      - change_mutability
      - reclassify
      - merge
      - forget_request
    autonomous_create_allowed: true
    autonomous_update_allowed: true
    autonomous_archive_allowed: true
    autonomous_forget_allowed: false
    append_only_default: false
    immutable_default: false
    durable_by_default: false
    allow_direct_user_edit: true

