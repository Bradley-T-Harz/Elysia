version: "1.0"

notes: |
  Law for each mutation verb in the memory system.
  This file defines the default posture of each mutation type across memory classes.
  Class-specific defaults, sensitivity behavior, retention timing, and promotion
  transitions are governed in their own policy files.

mutation_rules:
  create:
    allowed_classes:
      - working
      - conversation
      - project
      - research
      - operational
      - preference
      - sealed_private
      - audit
    blocked_classes: []
    autonomous_allowed: true
    review_required: false
    requires_reason: true
    requires_target: false
    requires_expected_revision: false
    requires_provenance: false
    allow_multi_target: false
    allow_sealed_private: true
    allow_direct_apply: true

