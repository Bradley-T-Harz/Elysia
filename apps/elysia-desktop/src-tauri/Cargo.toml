[package]
name = "elysia-desktop"
version = "1.0.0"
description = "Local desktop chamber shell for Elysia."
authors = ["EcoSyneva Commons LLC"]
license = "Apache-2.0"
homepage = "https://elysiaecobotics.com"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
